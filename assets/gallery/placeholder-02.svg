<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Gallery photo placeholder 02</title>
  <desc id="description">Replace this placeholder with an approved gallery photograph.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#080b09"/>
      <stop offset="1" stop-color="#242925"/>
    </linearGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0v120" fill="none" stroke="#e7ede9" stroke-opacity=".06" stroke-width="2"/>
